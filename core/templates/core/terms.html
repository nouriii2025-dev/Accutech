{% extends "core/base.html" %}
{% block title %}Terms & Conditions | Accutech{% endblock %}

{% block content %}
<section class="section" style="padding-top: 160px;">
  <div class="container-fluid-safe">
    <div class="eyebrow reveal in">{{ terms_eyebrow }}</div>
    <h1 class="reveal in" style="max-width: 20ch; font-size: clamp(2rem, 3.4vw, 2.8rem);">
      {{ terms_title }}
    </h1>
    <p class="section-lede reveal in" style="max-width: 62ch;">
      {{ terms_description }}
    </p>
  </div>
</section>

<section class="section-panel">
  <div class="container-fluid-safe">
    <div class="reveal" style="display:grid; gap: 2.2rem; max-width: 78ch;">
      {% for term in terms %}
      <div>
        <h3>{{ term.title }}</h3>
        <p style="color: var(--steel);">
          {{ term.description }}
        </p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
